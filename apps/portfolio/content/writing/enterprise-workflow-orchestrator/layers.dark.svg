<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, monospace" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#939aa9"/></marker></defs>
  <g fill="#11151e" stroke="#e8ebf2" stroke-width="1.2">
    <rect x="20" y="40" width="128" height="56" rx="10"/>
    <rect x="204" y="40" width="128" height="56" rx="10"/>
    <rect x="388" y="40" width="128" height="56" rx="10" stroke="#f2a24e"/>
    <rect x="572" y="40" width="128" height="56" rx="10"/>
  </g>
  <g fill="none" stroke="#939aa9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)">
    <path d="M148 68h52"/><path d="M332 68h52"/><path d="M516 68h52"/>
