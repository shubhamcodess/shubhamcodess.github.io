  <g fill="#e8ebf2" text-anchor="middle">
    <text x="84" y="65">app</text><text x="84" y="82" fill="#939aa9" font-size="10">starts it, no logic</text>
    <text x="268" y="65">core</text><text x="268" y="82" fill="#939aa9" font-size="10">api, engine, queue</text>
    <text x="452" y="65" fill="#f2a24e">plug-ins</text><text x="452" y="82" fill="#939aa9" font-size="10">jobs and alerts</text>
    <text x="636" y="65">records</text><text x="636" y="82" fill="#939aa9" font-size="10">log, data, types</text>
    <text x="360" y="156" fill="#939aa9" font-size="10">sixteen modules in four layers; each one only depends on the layers to its right</text>
